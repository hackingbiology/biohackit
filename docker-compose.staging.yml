# Public staging stack (see docs/STAGING.md). Only port 18800 is published.
# Demo data only, no password wall, not indexed by search engines.
services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: biohackit
      POSTGRES_PASSWORD: biohackit
      POSTGRES_DB: biohackit
    volumes:
      - pgdata-staging:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biohackit -d biohackit"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "uv run --frozen --no-dev python manage.py migrate --noinput &&
             uv run --frozen --no-dev python manage.py collectstatic --noinput &&
             uv run --frozen --no-dev python manage.py seed_demo &&
             uv run --frozen --no-dev gunicorn biohackit.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgres://biohackit:biohackit@db:5432/biohackit
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      DEBUG: "false"
      NOINDEX: "true"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      ALLOWED_HOSTS: "backend,localhost,51.158.36.151"
      CSRF_TRUSTED_ORIGINS: "http://51.158.36.151:18800"
      CORS_ALLOWED_ORIGINS: "http://51.158.36.151:18800"
      FRONTEND_URL: "http://51.158.36.151:18800"
      DEMO_USERNAME: ${DEMO_USERNAME:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        BACKEND_INTERNAL_URL: "http://backend:8000"
        NOINDEX: "1"
    ports:
      - "18800:3000"
    depends_on:
      - backend

volumes:
  pgdata-staging:
