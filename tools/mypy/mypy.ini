[mypy]
python_version = 3.12
strict = True
plugins = mypy_django_plugin.main
mypy_path = backend
follow_imports = silent

[mypy.plugins.django-stubs]
django_settings_module = biohackit.settings

# Third-party libraries without stubs; they are not our code.
[mypy-allauth.*,environ.*]
ignore_missing_imports = True
