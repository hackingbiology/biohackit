services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: biohackit
      POSTGRES_PASSWORD: biohackit
      POSTGRES_DB: biohackit
    volumes:
      - pgdata:/home/postgres/pgdata/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biohackit -d biohackit"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgres://biohackit:biohackit@db:5432/biohackit
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-key-change-in-production}
      DEBUG: ${DEBUG:-true}
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
